<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Photo Gallery</title>
	<link rel="stylesheet" href="css/gallery.css">
	<script src = "js/gallery.js"></script>
</head>
<body onload="pickImage()">
	<header><img id="header_img" src="" width="100" alt="waiting for an image"></header>
	<main id="main">

	<div id = "image">
		Hover over an image below to display here.
	</div>
	
	<div class="flex"><img class = "preview" alt = "forest" src = "images/fort_in_woods.png" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus = "upDate(this)" onblur = "unDo()">
	<img class = "preview" alt = "sun in the forest" src = "images/istockphoto-1419410282-612x612.jpg" onmouseover = "upDate(this)" onmouseout = "unDo()">
	<img class = "preview" src = "images/pexels-pixabay-158063.jpg" alt = "canal view" onmouseover = "upDate(this)" onmouseout = "unDo()">
<img class = "preview" src = "images/colourful.jpg" alt = "colorful water" onmouseover = "upDate(this)" onmouseout = "unDo()">
<img class = "preview" src = "images/high_altitude_aerial_view_above_cotton_soft_cloud_tops_glowing_in_golden_hour_light-full.jpg" alt = "sunset" onmouseover = "upDate(this)" onmouseout = "unDo()">
<img class = "preview" src = "images/pexels-alena-koval-233944-886521.jpg" alt = "a leaf petal" onmouseover = "upDate(this)" onmouseout = "unDo()"></div>
	</main>
</body>
</html>
